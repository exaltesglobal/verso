[package]
name = "verso"
license = "UNLICENSED"
publish = false
version = "0.1.0"
description = "Verso, the reels-first desktop video editor by Agape Labs"
authors = ["Agape Labs <exaltes.global@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "verso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Offline captions. whisper-rs is Unlicense, whisper.cpp (vendored by whisper-rs-sys) is MIT.
whisper-rs = { version = "=0.16.0", optional = true }
# Reframe models (ONNX Runtime). MIT/Apache.
ort = "=2.0.0-rc.15"
# Beat detection (FFT). MIT/Apache.
rustfft = "6.4.1"
sha2 = "0.10"
# Model downloads: captions uses ureq 2 (renamed), reframe uses ureq 3.
ureq2 = { package = "ureq", version = "2" }
ureq = "3"

[features]
default = ["whisper"]
# The on-device speech engine. Building it needs CMake (see README, "Captions engine").
whisper = ["dep:whisper-rs"]
# GPU acceleration. Needs the CUDA toolkit (Windows/Linux) or Xcode (macOS) at build time.
cuda = ["whisper", "whisper-rs/cuda"]
metal = ["whisper", "whisper-rs/metal"]
# Optional GPU acceleration for the reframe models (CPU is always the fallback).
directml = ["ort/directml"]
coreml = ["ort/coreml"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
