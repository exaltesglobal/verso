# Builds Windows and macOS installers. Every run uploads them as workflow artifacts.
# On a version tag (v1.2.3, or v1.2.3-beta.1 for a pre-release) it also publishes a GitHub release with
# the installers, SHA256SUMS.txt and updater artifacts.
# Setup (repo Settings > Secrets and variables > Actions) is listed in docs/RELEASE.md and docs/SIGNING.md.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          # Native runners per arch so FFmpeg (built below) is native too.
          - platform: macos-15
            target: aarch64-apple-darwin
            features: metal
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            build_ort: true # ort has no prebuilt ONNX Runtime for Intel Macs
    runs-on: ${{ matrix.platform }}
    env:
      # ONNX Runtime (ort prebuilt and source build) targets macOS 13.4, so the Mac app does too.
      MACOSX_DEPLOYMENT_TARGET: "13.4"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # ---------- FFmpeg sidecars (LGPL) ----------
      - name: Fetch FFmpeg sidecars (Windows)
        if: runner.os == 'Windows'
        run: pnpm fetch:ffmpeg

      # LGPL FFmpeg built from source (scripts/build-ffmpeg-macos.sh), cached per arch and script version.
      # restore/save are separate so the cache survives a later failing step.
      - name: Restore FFmpeg (macOS)
        if: runner.os == 'macOS'
        id: ffcache
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-out
          key: ffmpeg-macos-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}
      - name: Build FFmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          brew install pkg-config nasm meson ninja || true
          WORK="$RUNNER_TEMP/ffmpeg-build" bash scripts/build-ffmpeg-macos.sh ffmpeg-out
      - name: Save FFmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ffmpeg-out
          key: ${{ steps.ffcache.outputs.cache-primary-key }}

      # ONNX Runtime for Intel Macs (scripts/build-onnxruntime-macos.sh), linked statically by ort.
      - name: Restore ONNX Runtime (Intel Mac)
        if: matrix.build_ort
        id: ortcache
        uses: actions/cache/restore@v4
        with:
          path: ort-out
          key: ort-macos-${{ matrix.target }}-${{ hashFiles('scripts/build-onnxruntime-macos.sh') }}
      - name: Build ONNX Runtime (Intel Mac)
        if: matrix.build_ort && steps.ortcache.outputs.cache-hit != 'true'
        shell: bash
        run: WORK="$RUNNER_TEMP/ort-build" bash scripts/build-onnxruntime-macos.sh ort-out
      - name: Save ONNX Runtime (Intel Mac)
        if: matrix.build_ort && steps.ortcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ort-out
          key: ${{ steps.ortcache.outputs.cache-primary-key }}
      # whisper.cpp Metal and ONNX Runtime CoreML use @available, which needs clang's runtime library;
      # rustc does not link it by default.
      - name: Link clang runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rt="$(clang -print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          ls "$rt"
          echo "CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_RUSTFLAGS=-C link-arg=$rt -C link-arg=-lsqlite3" >> "$GITHUB_ENV"
      - name: Use ONNX Runtime (Intel Mac)
        if: matrix.build_ort
        shell: bash
        run: echo "ORT_LIB_LOCATION=$PWD/ort-out/Release" >> "$GITHUB_ENV"
      - name: FFmpeg sidecars (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          for b in ffmpeg ffprobe; do
            cp "ffmpeg-out/$b" "src-tauri/binaries/$b-${{ matrix.target }}"
            chmod +x "src-tauri/binaries/$b-${{ matrix.target }}"
          done
          cp ffmpeg-out/FFMPEG-LICENSE.txt src-tauri/binaries/FFMPEG-LICENSE.txt
          ./src-tauri/binaries/ffmpeg-${{ matrix.target }} -hide_banner -version

      # ---------- Release config overlay ----------
      - name: Release config
        id: cfg
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          ENDPOINT: ${{ vars.VERSO_UPDATE_ENDPOINT }}
        run: |
          node -e '
            const fs = require("fs");
            const pubkey = process.env.PUBKEY || "";
            const cfg = {
              bundle: { createUpdaterArtifacts: Boolean(pubkey), macOS: { minimumSystemVersion: process.env.MACOSX_DEPLOYMENT_TARGET || "11.0" } },
              plugins: { updater: { pubkey } }
            };
            if (process.env.ENDPOINT) cfg.plugins.updater.endpoints = [process.env.ENDPOINT];
            fs.writeFileSync("src-tauri/tauri.release.conf.json", JSON.stringify(cfg, null, 2));
          '
          args="--target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json"
          [ -n "${{ matrix.features }}" ] && args="$args --features ${{ matrix.features }}"
          if [ -f "src-tauri/binaries/FFMPEG-LICENSE.txt" ]; then
            args="$args --config src-tauri/tauri.sidecar.conf.json"
          else
            echo "::error::FFmpeg sidecars missing"; exit 1
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      # Apple signing and notarization run only when the secrets exist (empty values make the bundler fail).
      # Without a certificate the app is ad-hoc signed ("-") so it launches on Apple silicon.
      - name: Apple signing env
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          [ -z "$APPLE_SIGNING_IDENTITY" ] && echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          true

      # Placeholder: Windows code signing. Import a .pfx from secrets and set bundle.windows.certificateThumbprint
      # (see docs/RELEASE.md). Unsigned installers work but show a SmartScreen warning.
      # - name: Import Windows certificate
      #   if: runner.os == 'Windows'
      #   shell: pwsh
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #     WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      #   run: |
      #     [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
      #     Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My `
      #       -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_VERSO_API_URL: ${{ vars.VITE_VERSO_API_URL }}
          VITE_VERSO_BETA_GATE: ${{ vars.VITE_VERSO_BETA_GATE }}
          VERSO_ENTITLEMENT_PUBLIC_KEY: ${{ vars.VERSO_ENTITLEMENT_PUBLIC_KEY }}
        with:
          # Only tag builds create a (draft) release; the release job below publishes it.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Verso ${{ github.ref_name }}
          releaseBody: |
            Unsigned beta build.
            - **Windows**: run the `-setup.exe` (or `.msi`). If SmartScreen appears, click **More info** then **Run anyway**.
            - **Mac**: pick `aarch64` for Apple silicon (M1 and later) or `x64` for Intel. Drag Verso to Applications,
              then right-click Verso and choose **Open** (on macOS 15, use System Settings > Privacy & Security >
              **Open Anyway**), or run `xattr -d com.apple.quarantine /Applications/Verso.app`.
            Check downloads against `SHA256SUMS.txt`.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ steps.cfg.outputs.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: verso-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          # Artifacts keep their bundle subfolders (dmg/, nsis/, msi/); list installers by file name only.
          find . -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -exec sha256sum {} + | sed 's#  .*/#  #' > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          # Keep the release as a draft; the owner publishes it by hand when ready.
